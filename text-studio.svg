<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" filter="url(#shadow)"/>

  <!-- Code Bracket accents -->
  <path d="M 52 100 L 36 128 L 52 156" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 204 100 L 220 128 L 204 156" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Java Steam Flames -->
  <path d="M 100 75 C 90 60 110 50 105 38 C 100 30 92 28 92 28 C 92 28 102 32 102 42 C 102 52 86 60 98 75 Z" fill="url(#steamGrad)"/>
  <path d="M 128 72 C 118 55 138 45 133 32 C 128 22 120 20 120 20 C 120 20 130 24 130 35 C 130 46 114 55 126 72 Z" fill="url(#steamGrad)"/>
  <path d="M 156 75 C 146 60 166 50 161 38 C 156 30 148 28 148 28 C 148 28 158 32 158 42 C 158 52 142 60 154 75 Z" fill="url(#steamGrad)"/>

  <!-- Coffee Cup Base (Java Symbol) -->
  <path d="M 80 96 L 176 96 C 176 96 182 144 164 168 C 148 188 108 188 92 168 C 74 144 80 96 80 96 Z" fill="url(#cupGrad)"/>
  
  <!-- Cup Handle -->
  <path d="M 174 108 C 196 108 204 122 204 136 C 204 152 192 164 170 164" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>

  <!-- Cup Rim Accent -->
